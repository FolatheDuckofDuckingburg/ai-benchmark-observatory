name: Analysis pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run validation and analysis
        run: python analysis/scripts/run_pipeline.py
      - name: Upload regenerated outputs and run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-pipeline-outputs
          path: |
            results/tables/
            results/figures/
            results/logs/latest_pipeline_run.log
          if-no-files-found: warn
